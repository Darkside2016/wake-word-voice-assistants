esphome:
  name: boots-display-box
  friendly_name: "Boots Zentral-Display"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "Bootssteuerung"
  password: "SchaltmicheinOhWeh"

api:
logger:
ota:
  - platform: esphome

# Bindet die herstellereigene Display- und Audio-Konfiguration ein
packages:
  box_config: !include common/base.yaml

# SENSORKANÄLE AUS DEINEM HOME ASSISTANT
text_sensor:
  - platform: homeassistant
    id: wetter_zustand
    entity_id: weather.dwd_weather_boot
  - platform: homeassistant
    id: heizung_status
    entity_id: sensor.status

sensor:
  - platform: homeassistant
    id: brenner_temp
    entity_id: sensor.afterburner_afterburner342f84_heater_temperature
  - platform: homeassistant
    id: rest_diesel
    entity_id: sensor.fuel_level
  - platform: homeassistant
    id: raum_temp
    entity_id: sensor.desired_temperature
  - platform: homeassistant
    id: bat_volt
    entity_id: sensor.afterburner_afterburner342f84_input_voltage_2
  - platform: homeassistant
    id: wind_speed
    entity_id: weather.dwd_weather_boot
    attribute: wind_speed
  - platform: homeassistant
    id: luefter_rpm
    entity_id: sensor.afterburner_afterburner342f84_fan_speed
  - platform: homeassistant
    id: kerze_ampere
    entity_id: sensor.afterburner_afterburner342f84_glow_plug_current
  - platform: homeassistant
    id: wecker_zeit
    entity_id: input_datetime.boots_wecker_zeit

# Lokale Schriftart aus der Cloud-Struktur
font:
  - file: "fonts/Roboto-Regular.ttf"
    id: font_xs
    size: 14
  - file: "fonts/Roboto-Regular.ttf"
    id: font_small
    size: 20
  - file: "fonts/Roboto-Regular.ttf"
    id: font_normal
    size: 26
  - file: "fonts/Roboto-Regular.ttf"
    id: font_large
    size: 40

# VERKNÜPFUNG DEINER 4 COCKPIT-SEITEN
display:
  - platform: esp32_s3_box
    id: my_display
    pages:
      # --- SEITE 1: COCKPIT ---
      - id: main_page
        lambda: >-
          it.fill(Color(0x0F, 0x17, 0x2A));
          it.print(240, 15, id(font_normal), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_CENTER, "LIVE-COCKPIT");
          it.line(20, 55, 460, 55, Color(0x33, 0x41, 0x55));
          float s_temp = id(raum_temp).state;
          int arc_angle = (int)((s_temp / 30.0) * 270.0);
          it.arc(110, 150, 50, 135, 135 + arc_angle, Color(0xEF, 0x44, 0x44), 6);
          if (id(raum_temp).has_state()) {
            std::string r_str = str_sprintf("%.1f", s_temp);
            it.print(110, 130, id(font_normal), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_CENTER, r_str.c_str());
          }
          it.print(110, 165, id(font_xs), Color(0x64, 0x74, 0x8B), TextAlign::TOP_CENTER, id(heizung_status).state.c_str());
          it.line(240, 65, 240, 390, Color(0x33, 0x41, 0x55));
          it.line(20, 220, 460, 220, Color(0x33, 0x41, 0x55));
          it.print(270, 235, id(font_xs), Color(0x94, 0xA3, 0xB8), TextAlign::TOP_LEFT, "WETTER LIVE");
          if (id(wetter_zustand).has_state()) { it.print(270, 265, id(font_small), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_LEFT, id(wetter_zustand).state.c_str()); }

      # --- SEITE 2: HEIZUNGS-DIAGNOSE ---
      - id: diagnose_page
        lambda: >-
          it.fill(Color(0x1E, 0x1E, 0x2E));
          it.print(240, 15, id(font_normal), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_CENTER, "HEIZUNGS-DIAGNOSE");
          it.line(20, 55, 460, 55, Color(0x33, 0x41, 0x55));
          if (id(brenner_temp).has_state()) { it.print(30, 80, id(font_small), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_LEFT, str_sprintf("Brennertemp: %.0f C", id(brenner_temp).state).c_str()); }
          if (id(luefter_rpm).has_state()) { it.print(30, 120, id(font_small), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_LEFT, str_sprintf("Luefterdrehzahl: %.0f RPM", id(luefter_rpm).state).c_str()); }
          if (id(kerze_ampere).has_state()) { it.print(30, 160, id(font_small), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_LEFT, str_sprintf("Gluehkerze: %.1f A", id(kerze_ampere).state).c_str()); }

      # --- SEITE 3: STROM & ENERGIE ---
      - id: energy_page
        lambda: >-
          it.fill(Color(0x02, 0x2C, 0x22));
          it.print(240, 15, id(font_normal), Color(0x34, 0xD3, 0x99), TextAlign::TOP_CENTER, "ENERGIE-MANAGEMENT");
          it.line(20, 55, 460, 55, Color(0x06, 0x5F, 0x46));
          if (id(bat_volt).has_state()) { it.print(30, 90, id(font_large), Color(0xFF, 0xFF, 0xFF), TextAlign::TOP_LEFT, str_sprintf("Bord-Netz: %.2f V", id(bat_volt).state).c_str()); }
          if (id(rest_diesel).has_state()) { it.print(30, 150, id(font_small), Color(0x34, 0xD3, 0x99), TextAlign::TOP_LEFT, str_sprintf("Diesel-Tank: %.1f Liter", id(rest_diesel).state).c_str()); }

      # --- SEITE 4: WECKER-ZENTRALE ---
      - id: wecker_page
        lambda: >-
          it.fill(Color(0x05, 0x05, 0x10));
          it.print(240, 40, id(font_normal), Color(0x47, 0x55, 0x69), TextAlign::TOP_CENTER, "Nachtmodus aktiv");
          if (id(wecker_zeit).has_state()) { it.print(240, 180, id(font_large), Color(0xF5, 0x9E, 0x0B), TextAlign::TOP_CENTER, "Wecker aktiv"); }
          it.print(240, 430, id(font_xs), Color(0x33, 0x41, 0x55), TextAlign::TOP_CENTER, "Tippen zum Aufwachen");

# TOUCHSCREEN FÜR DAS SEITENBLÄTTERN
touchscreen:
  - platform: gt911
    id: board_touch
    display: my_display
    on_touch:
      - lambda: |-
          id(my_display).show_next_page();
